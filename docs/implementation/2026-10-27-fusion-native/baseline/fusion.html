.timeline-head{min-height:44px;margin:8px 0 4px}.timeline-head h2{font-size:14px;font-weight:600}.timeline-head .text-btn{font-size:12px;font-weight:400;min-height:44px}.timeline-head .text-btn .icon{width:14px;height:14px}.timeline-head [aria-expanded=true] .icon{transform:rotate(180deg)}.schedule-row{grid-template-columns:42px 16px minmax(0,1fr);min-height:102px}.time{font-size:12px;font-weight:550;padding-top:17px;color:var(--muted);line-height:20px}.rail{padding-top:23px}.rail:after{left:7px;top:30px;bottom:-19px;background:#d2dfd5}.rail-dot{width:7px;height:7px;border-color:#89a795}.slot{grid-template-columns:minmax(0,1fr) 104px;gap:10px;min-height:102px;padding:6px 0 7px;align-items:start}.task-title{min-height:44px;padding:5px 0;display:flex;align-items:center;font-size:16px;font-weight:650;line-height:1.45;overflow-wrap:anywhere;max-width:100%}.task-meta{font-size:13px;margin-top:-1px;line-height:1.5;color:var(--muted)}.original-meta{font-size:12px;color:var(--muted);line-height:1.5;margin-top:2px}.task-actions{display:flex;flex-direction:column;align-items:stretch;gap:0;min-width:0}.checkin{width:100%;min-height:44px;height:44px;display:flex;flex-direction:row;gap:0;margin:0;border-radius:10px;font-size:14px;font-weight:600;line-height:1.4}.busy-btn{grid-column:auto;min-width:104px;min-height:44px;width:100%;margin:0;padding:7px 0;font-size:12px;line-height:1.4;display:flex;align-items:center;justify-content:center;white-space:nowrap;background:transparent;border-radius:8px;color:var(--primary)}
.done.schedule-row{min-height:68px}.done .slot{min-height:68px;padding-top:0;padding-bottom:6px;align-items:center}.done .task-title{font-size:14px;font-weight:500;min-height:44px}.done .task-meta{font-size:12px;margin-top:0;color:var(--muted)}.done .time{font-size:12px;color:var(--muted);padding-top:12px}.done .rail{padding-top:20px}.done .rail-dot{width:11px;height:11px;margin-top:-2px;background:var(--primary)}.done .rail:after{top:29px;bottom:-20px}.done .task-actions{align-self:center}.undo{border:0;background:transparent;width:100%;min-width:44px;min-height:44px;color:var(--muted);font-size:12px;margin:0;padding:8px}.timeline-note{display:block;padding-top:14px;color:var(--muted);font-size:12px;line-height:1.6}.today-quote{font-size:13px;color:var(--primary);margin:14px 0 0;text-align:center}
.segmented{margin-top:16px;background:var(--soft)}.segment{min-height:44px}.period{margin:14px 0 16px;font-size:12px}.progress-copy{margin-bottom:16px}.progress-copy h2{font-size:20px;line-height:1.4}.progress-copy p{font-size:12px;margin-top:6px}.daily-chart{margin-top:16px;gap:8px}.bar-stack{max-width:23px;height:104px;gap:4px}.bar-unit{height:23px;border-color:#cbdacf}.bar-unit.minimum,.swatch.minimum{background:var(--busy);border-color:#8ab29a}.calendar-day b{font-size:12px}.current-line{padding:10px 12px;background:var(--pale);border-radius:10px}.rate-row{margin-top:16px}.rate-row h3{font-size:13px}.rate-value{color:var(--primary);font-size:27px}.chart-legend{gap:8px 14px;padding-bottom:16px}
.detail-name{margin-top:16px}.detail-name h2{font-size:24px}.status-line{margin-top:6px}.target-lines{padding:8px 0 10px}.target-line{padding:6px 0}.detail-actions{margin-top:12px;gap:8px}.detail-actions .primary,.detail-actions .secondary{min-height:44px;font-size:13px}.note-copy{font-size:13px;line-height:1.7}.form-intro{margin:8px 0 20px}.form-field{margin-bottom:20px}.field-label{font-size:14px}.field-label>span{font-size:12px}.weekday-btn{width:44px;min-width:44px}.weekday-btn.selected{border-color:var(--primary);color:var(--primary);background:var(--pale)}.setting-row{min-height:64px}.mine-intro{margin-top:18px}.mine-intro h2{font-size:20px}.mine-count{color:var(--primary)}.menu-icon{background:var(--pale)}.demo-footer{font-size:12px}.tabs{height:66px;min-height:66px;border-top:1px solid var(--line);padding-top:4px}.tab{font-size:12px;gap:1px}.tab-icon{height:27px}.tab.active .tab-icon{background:var(--pale)}

<body>
<div class="app" id="app" data-screen="today">
  <header class="platform"><span class="platform-title">渐成习惯打卡</span><span class="capsule" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><i></i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="7.2"/><circle cx="12" cy="12" r="2"/></svg></span></header>
  <main id="content" tabindex="-1"></main>
  <nav class="tabs" id="tabs" aria-label="主要导航"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</div>
<script>
(() => {
  'use strict';
  const TODAY='2026-10-27';
  const iconPaths={plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12 4 4L19 6"/>',chevron:'<path d="m9 5 7 7-7 7"/>',down:'<path d="m6 9 6 6 6-6"/>',back:'<path d="m14 5-7 7 7 7"/>',clock:'<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',today:'<rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4M16 3v4M4 10h16m-10 5 2 2 4-4"/>',chart:'<path d="M4 4v16h17M8 15v-4M13 15V7M18 15v-7"/>',person:'<circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>',sliders:'<path d="M4 7h5m5 0h6M4 17h10m5 0h1"/><circle cx="11.5" cy="7" r="2.5"/><circle cx="16.5" cy="17" r="2.5"/>',book:'<path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1m0-14c3-2 6-2 9-1v14c-3-1-6-1-9 1V6Z"/>',people:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5"/>',message:'<path d="M20 16a3 3 0 0 1-3 3H9l-5 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v10Z"/><path d="M8 8h8M8 12h5"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',spark:'<path d="M13 3 5 14h6l-1 7 9-12h-6l0-6Z"/>'};
  function icon(name,extra=''){return '<svg class="icon '+extra+'" aria-hidden="true" viewBox="0 0 24 24">'+(iconPaths[name]||iconPaths.chevron)+'</svg>'}
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  const tasks=[
    {id:'stretch',name:'晨间拉伸',normal:8,minimum:2,unit:'分钟',time:'07:30',days:[1,2,3,4,5,6,0],start:'2026-10-01',note:'起床后慢慢伸展，动作以舒适为准。',completed:'original',history:['original','original','none','original','minimum','original']},
    {id:'read',name:'读一会儿',normal:20,minimum:2,unit:'分钟',time:'12:30',days:[1,2,3,4,5,6,0],start:'2026-10-01',note:'把书放在桌边，午饭后读几页。',completed:null,history:['original','minimum','none','original','original','original']},
    {id:'walk',name:'走一会儿',normal:20,minimum:5,unit:'分钟',time:'18:30',days:[1,2,3,4,5,6,0],start:'2026-10-01',note:'晚饭前出门走一段，忙时也可以只走五分钟。',completed:null,history:['minimum','original','none','original','original','none']},
    {id:'tidy',name:'睡前整理',normal:10,minimum:2,unit:'分钟',time:'21:30',days:[1,2,3,4,5,6,0],start:'2026-10-01',note:'收好桌面，给明天留一个清爽的开始。',completed:null,history:['none','original','none','minimum','none','none']}
  ];
  const state={screen:'today',selected:'read',showCompleted:true,showShortPhrase:false,period:'week',editingId:null,form:null,formError:'',detailNoteOpen:false,adjustOpen:false,operationsOpen:false,minePanel:null,counter:0};
  const app=document.getElementById('app'),main=document.getElementById('content'),tabs=document.getElementById('tabs'),toastEl=document.getElementById('toast');
  let toastTimer;
  function scheduled(){return tasks.filter(t=>t.days.includes(2)&&t.start<=TODAY).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))}
  function totals(){const list=scheduled();const original=list.filter(t=>t.completed==='original').length,minimum=list.filter(t=>t.completed==='minimum').length;return {list,original,minimum,done:original+minimum,plan:list.length}}
  function taskById(id){return tasks.find(t=>t.id===id)||tasks[1]}
  function normal(t){return t.todayGoal||t.normal}
  function completedAmount(t){return t.completedGoal??(t.completed==='minimum'?t.minimum:t.normal)}
  function amount(v,u){return esc(v)+' '+esc(u)}
  function frequency(days){if(days.length===7)return '每天';if(days.length===5&&[1,2,3,4,5].every(d=>days.includes(d)))return '周一至周五';return days.map(d=>['周日','周一','周二','周三','周四','周五','周六'][d]).join('、')}
  function notice(message){clearTimeout(toastTimer);toastEl.textContent=message;toastEl.classList.add('visible');toastTimer=setTimeout(()=>toastEl.classList.remove('visible'),3600)}
  function top(title,action=''){return '<div class="heading"><h1>'+title+'</h1>'+action+'</div>'}
  function backTop(title){return '<div class="heading back-heading"><button class="icon-btn" data-action="back" aria-label="返回今日">'+icon('back')+'</button><h1>'+title+'</h1></div>'}
  function row(t){
    const done=!!t.completed;
    const goal=done?(t.completed==='minimum'?'忙时已打卡 · ':'已打卡 · ')+amount(completedAmount(t),t.unit):(t.todayGoal?'今天 ':'平时 ')+amount(normal(t),t.unit);
    const primary='<button class="checkin" data-action="complete" data-id="'+esc(t.id)+'" aria-label="'+esc(t.name)+(t.todayGoal?'按今天缩减目标':'按平时目标')+amount(normal(t),t.unit)+'打卡">打卡</button>';
    const secondary=t.minimum&&!t.todayGoal?'<button class="busy-btn" data-action="minimum" data-id="'+esc(t.id)+'" aria-label="'+esc(t.name)+'按忙时目标'+amount(t.minimum,t.unit)+'打卡">忙时 '+amount(t.minimum,t.unit)+'打卡</button>':t.todayGoal?'<button class="busy-btn" data-action="restore-today" data-id="'+esc(t.id)+'">恢复原目标</button>':'';
    return '<article class="schedule-row '+(done?'done':'')+'" data-habit="'+esc(t.id)+'"><div class="time">'+esc(t.time||'未定')+'</div><div class="rail"><span class="rail-dot">'+(done?icon('check'):'')+'</span></div><div class="slot"><div class="task-copy"><button class="task-title" data-action="open-detail" data-id="'+esc(t.id)+'" aria-label="查看'+esc(t.name)+'详情">'+esc(t.name)+'</button><div class="task-meta">'+goal+'</div>'+(t.todayGoal&&!done?'<div class="original-meta">平时 '+amount(t.normal,t.unit)+'</div>':'')+'</div><div class="task-actions">'+(done?'<button class="undo" data-action="undo" data-id="'+esc(t.id)+'" aria-label="撤销'+esc(t.name)+'的打卡">撤销</button>':primary+secondary)+'</div></div></article>';
  }
  function renderToday(){
    const s=totals(),visible=s.list.filter(t=>state.showCompleted||!t.completed);let noTime=false;
    const progress=s.list.map(t=>'<span class="'+(t.completed==='original'?'filled':t.completed==='minimum'?'minimum':'')+'"></span>').join('');
    return '<div class="page today-page">'+top('今日','<button class="add-task" data-action="new">'+icon('plus')+'添加习惯</button>')+'<p class="subline tabular">10月27日，星期二</p><div class="today-summary"><div class="summary-top"><div class="summary-label"><strong class="tabular">'+s.done+' <span>/ '+s.plan+'</span></strong><span>已打卡</span></div><button class="text-btn" data-action="screen" data-screen="progress">查看进度'+icon('chevron')+'</button></div><div class="summary-bottom"><div class="summary-progress" role="img" aria-label="今日共'+s.plan+'项，已打卡'+s.done+'项">'+progress+'</div><span class="remaining">'+(s.plan-s.done?'待做 '+(s.plan-s.done)+' 项':'今日安排已全部打卡')+'</span></div></div><div class="timeline-head"><h2>今天的安排</h2><button class="text-btn" data-action="toggle-completed" aria-expanded="'+state.showCompleted+'">'+(state.showCompleted?'收起':'展开')+'已完成（'+s.done+'）'+icon(state.showCompleted?'down':'down')+'</button></div><div class="timeline">'+(visible.length?visible.map(t=>{let label='';if(!t.time&&!noTime){label='<div class="unscheduled">未设置计划时间</div>';noTime=true}return label+row(t)}).join(''):'<div class="empty"><p>'+(s.plan?'今天的安排都已打卡。':'今天还没有安排。')+'</p><button class="secondary" data-action="'+(s.plan?'toggle-completed':'new')+'">'+(s.plan?'查看已完成':'添加一个习惯')+'</button></div>')+'</div>'+(state.showShortPhrase?'<p class="today-quote">每天一点，慢慢渐成。</p>':'')+'<p class="timeline-note">时间仅用于安排顺序，不会发送提醒。</p></div>';
  }
  function chart(){
    const s=totals(),daily=[3,4,0,4,3,2,s.done],original=[2,3,0,3,2,2,s.original],minimum=[1,1,0,1,1,0,s.minimum];
    return '<div class="chart-title">每天完成 / 安排<span>每格 1 项</span></div><div class="daily-chart" role="img" aria-label="10月21日至27日，每日完成及安排：'+daily.map((n,i)=>(21+i)+'日'+n+'/'+(i===6?s.plan:4)+'项').join('，')+'。深绿为原目标，薄荷色为忙时，空白为未打卡。">'+daily.map((n,i)=>'<div class="chart-column '+(i===6?'current':'')+'"><div class="bar-count">'+n+' / '+(i===6?s.plan:4)+'</div><div class="bar-stack">'+Array.from({length:i===6?s.plan:4},(_,j)=>'<span class="bar-unit '+(j<original[i]?'original':j<original[i]+minimum[i]?'minimum':'')+'"></span>').join('')+'</div><div class="bar-date">'+(21+i)+'</div><div class="bar-week">'+['三','四','五','六','日','一','今天'][i]+'</div></div>').join('')+'</div><div class="chart-legend"><span class="legend-item"><i class="swatch original"></i>原目标</span><span class="legend-item"><i class="swatch minimum"></i>忙时</span><span class="legend-item"><i class="swatch"></i>未打卡</span></div>';
  }
  function renderProgress(){
    const s=totals();const isMonth=state.period==='month';
    let body='';
    if(state.period==='calendar'){
      const ds=[3,4,0,4,3,2,s.done];
      body='<div class="calendar-title"><h2>2026年10月</h2><span>当前窗口样例</span></div><div class="calendar">'+['一','二','三','四','五','六','日'].map(w=>'<span class="weekday">'+w+'</span>').join('')+'<div class="calendar-day blank"></div>'.repeat(3)+Array.from({length:31},(_,i)=>{const day=i+1,inSample=day>=21&&day<=27;return '<div class="calendar-day '+(inSample?'sample':'')+' '+(day===27?'today':'')+'"><span>'+day+'</span><b>'+(inSample?ds[day-21]+'/'+(day===27?s.plan:4):'—')+'</b></div>'}).join('')+'</div><p class="calendar-note">数字为当天完成 / 安排。仅 10月21—27日提供演示记录；其余日期未提供数据，“—”不代表未打卡。</p><div class="current-line">'+icon('today')+'今天 '+s.done+' / '+s.plan+'，仍在进行中</div>';
    } else {
      body=(isMonth?'<div class="sample-note"><strong>近1个月 · 9月28日—10月27日</strong>本原型仅提供 10月21—27日的7天样例。其余日期未提供数据，因此不生成整月统计。</div>':'<p class="period tabular">2026年10月21日 — 10月27日</p>')+'<div class="progress-copy"><h2>'+(isMonth?'已提供的7天样例':'7天里，'+(5+(s.done>0?1:0))+'天有打卡')+'</h2><p>累计 '+(16+s.done)+' 次 · 原目标 '+(12+s.original)+' 次 · 忙时 '+(4+s.minimum)+' 次</p></div>'+chart()+'<div class="rate-row"><div><h3>截至昨天的按计划打卡率</h3><p class="tabular">10月21—26日 · 完成 16 / 安排 24 次</p></div><div class="rate-value">67<span class="small">%</span></div></div><div class="current-line">'+icon('clock')+'<span>今天 '+s.done+' / '+s.plan+'，仍在进行中</span></div><p class="help">'+(isMonth?'以上仅统计已提供的样例区间。':'有打卡 '+(5+(s.done>0?1:0))+' 天 / 安排 7 天。今天不计入截至昨天的打卡率。')+'</p>';
    }
    return '<div class="page">'+top('打卡进度')+'<p class="subline">看见记录，也看见每一天的安排</p><div class="segmented" role="group" aria-label="进度查看范围">'+[['week','近7天'],['month','近1个月'],['calendar','日历']].map(([id,label])=>'<button class="segment '+(state.period===id?'selected':'')+'" data-action="period" data-period="'+id+'" aria-pressed="'+(state.period===id)+'">'+label+'</button>').join('')+'</div>'+body+'</div>';
  }
  function newForm(t){return {name:t?t.name:'',normal:t?t.normal:20,minimum:t?(t.minimum||2):2,minimumEnabled:t?!!t.minimum:true,unit:t?t.unit:'分钟',days:t?[...t.days]:[1,2,3,4,5,6,0],start:t?t.start:TODAY,time:t?t.time:'',note:t?t.note:'',moreOpen:false}}
  function switchControl(action,checked,label){return '<button type="button" class="switch-hit" data-action="'+action+'" role="switch" aria-checked="'+checked+'" aria-label="'+label+'"><span class="switch" aria-hidden="true" aria-checked="'+checked+'"></span></button>'}
  function renderEdit(){
    if(!state.form)state.form=newForm(null);const f=state.form;
    return '<div class="page">'+backTop(state.editingId?'调整习惯计划':'添加习惯')+'<p class="form-intro">'+(state.editingId?'计划调整从明天起生效，今天保持原安排。':'平时认真做，忙时也能留下一小步。')+'</p><form id="habit-form" novalidate><div class="form-error" role="alert">'+esc(state.formError)+'</div><div class="form-field"><label class="field-label" for="habit-name">习惯名称<span>必填</span></label><input id="habit-name" name="name" type="text" maxlength="20" placeholder="例如：读一会儿" value="'+esc(f.name)+'" autocomplete="off"></div><div class="form-field"><label class="field-label" for="normal-goal">平时目标<span>必填</span></label><div class="value-unit"><input id="normal-goal" name="normal" type="number" min="1" max="9999" inputmode="numeric" value="'+esc(f.normal)+'"><select name="unit" aria-label="目标单位">'+['分钟','次','页'].map(u=>'<option '+(u===f.unit?'selected':'')+'>'+u+'</option>').join('')+'</select></div></div><div class="form-field"><div class="field-heading"><label class="field-label" for="minimum-goal">忙时目标<span>可选</span></label>'+switchControl('form-minimum',f.minimumEnabled,'启用忙时目标')+'</div>'+(f.minimumEnabled?'<div class="value-unit"><input id="minimum-goal" name="minimum" type="number" min="1" max="9999" inputmode="numeric" value="'+esc(f.minimum)+'"><span class="secondary" style="display:flex;align-items:center;justify-content:center;cursor:default;font-weight:400;color:var(--muted)">'+esc(f.unit)+'</span></div><p class="help">忙碌时做这个目标，也算完成一次打卡。</p>':'<div class="optional-off">只保留平时目标。需要时可以再开启。</div>')+'</div><div class="form-field"><div class="field-label" id="weekday-label">重复星期</div><div class="weekdays" role="group" aria-labelledby="weekday-label">'+[1,2,3,4,5,6,0].map(d=>'<button type="button" class="weekday-btn '+(f.days.includes(d)?'selected':'')+'" data-action="weekday" data-day="'+d+'" aria-pressed="'+f.days.includes(d)+'" aria-label="周'+['日','一','二','三','四','五','六'][d]+'">'+['日','一','二','三','四','五','六'][d]+'</button>').join('')+'</div><p class="help">'+(f.days.length?esc(frequency(f.days)):'请选择至少一天')+'</p></div><div class="form-field"><label class="field-label" for="start-date">开始日期</label>'+(state.editingId?'<input id="start-date" type="text" readonly value="'+esc(f.start.replaceAll('-','.'))+'">':'<select id="start-date" name="start"><option value="2026-10-27" '+(f.start===TODAY?'selected':'')+'>今天 · 10月27日</option><option value="2026-10-28" '+(f.start==='2026-10-28'?'selected':'')+'>明天 · 10月28日</option></select>')+'</div><details class="more-settings" '+(f.moreOpen?'open':'')+'><summary>更多设置'+icon('down')+'</summary><div class="form-field"><label class="field-label" for="plan-time">计划时间<span>可选</span></label><input id="plan-time" name="time" type="time" value="'+esc(f.time)+'"><p class="help">时间只用于今日安排排序，不会发送提醒。</p></div><div class="form-field"><label class="field-label" for="habit-note">备注<span>可选</span></label><textarea id="habit-note" name="note" maxlength="300" placeholder="给自己留一句小提示">'+esc(f.note)+'</textarea></div></details><div class="save-block"><button type="submit" class="primary full" data-action="save">'+(state.editingId?'保存明天的计划':'添加到我的习惯')+'</button><p>演示只保存在当前窗口，刷新后恢复。</p></div></form></div>';
  }
  function renderHistory(t){
    let cells='';for(let i=0;i<28;i++){const d=new Date(Date.UTC(2026,8,30+i));const day=d.getUTCDate();let mode='unknown';if(i>=21)mode=i===27?(t.completed||'none'):(t.history?.[i-21]||'unknown');cells+='<div class="history-cell '+mode+' '+(i===27?'today':'')+'" title="'+(d.getUTCMonth()+1)+'月'+day+'日 · '+({unknown:'未提供样例',original:'原目标完成',minimum:'忙时完成',none:'未打卡'}[mode])+'"><span>'+day+'</span><i class="history-mark"></i></div>'}
    return '<div class="history-grid" aria-label="近28天安排历史，9月30日至10月27日">'+cells+'</div><div class="history-legend"><span class="legend-item"><i class="swatch original"></i>原目标</span><span class="legend-item"><i class="swatch minimum"></i>忙时</span><span class="legend-item"><i class="swatch"></i>未打卡</span><span class="legend-item"><i class="swatch unknown"></i>无样例</span></div><p class="help">仅 10月21—27日提供样例；其余日期未提供记录。</p>';
  }
  function pendingPlanSummary(t){
    const p=t.pendingPlan;if(!p)return '';
    return '<div class="pending"><h3>计划已调整，明天起生效</h3><p style="margin-top:6px">'+esc(p.name)+' · 平时 '+amount(p.normal,p.unit)+(p.minimum?' · 忙时 '+amount(p.minimum,p.unit):' · 不设忙时目标')+'</p><p>'+esc(frequency(p.days))+' · '+esc(p.time||'未设置时间')+'</p><p style="margin-top:6px">今天仍按原计划：平时 '+amount(t.normal,t.unit)+'，'+esc(frequency(t.days))+'，'+esc(t.time||'未设置时间')+'。</p></div>';
  }
  function renderDetail(){
    const t=taskById(state.selected);const available=t.days.includes(2)&&t.start<=TODAY;
    return '<div class="page">'+backTop('习惯详情')+'<div class="detail-name"><h2>'+esc(t.name)+'</h2><div class="status-line"><span class="status-tag">进行中</span><span>'+esc(frequency(t.days))+'</span></div>'+pendingPlanSummary(t)+(t.pendingPause?'<p class="pending">已设置明天暂停。今天的安排和打卡保持有效。</p>':'')+'</div><section class="section"><div class="section-head"><h2>今日目标</h2><button class="text-btn" data-action="adjust-today" '+(t.completed?'disabled title="请先撤销打卡，再调整今天目标"':t.normal<=1?'disabled title="原目标已为1，无法再调小"':'')+'>只调整今天'+icon('chevron')+'</button></div><div class="target-lines"><div class="target-line"><span>'+(t.todayGoal?'今天已调整':'平时目标')+'</span><strong>'+amount(normal(t),t.unit)+'</strong></div>'+(t.minimum?'<div class="target-line"><span>忙时目标</span><strong>'+amount(t.minimum,t.unit)+'</strong></div>':'')+'</div>'+(t.todayGoal?'<button class="text-btn" data-action="restore-today" '+(t.completed?'disabled title="请先撤销打卡，再恢复原目标"':'')+'>恢复原目标 · '+amount(t.normal,t.unit)+'</button>':'')+(state.adjustOpen?'<form id="today-form" class="inline-adjust"><label for="today-goal">今天做少一点（'+esc(t.unit)+'）</label><div class="value-unit"><input id="today-goal" type="number" name="todayGoal" min="1" max="'+Math.max(1,t.normal-1)+'" step="1" inputmode="numeric" value="'+(t.todayGoal||Math.max(1,Math.floor(t.normal/2)))+'"><button class="secondary" type="submit" data-action="save-today">应用</button></div><p class="help">仅今天生效，须为小于原目标 '+amount(t.normal,t.unit)+' 的正整数。平时计划保持原值。</p></form>':'')+(available?'<div class="detail-actions '+(t.completed||t.todayGoal||!t.minimum?'single':'')+'">'+(t.completed?'<button class="secondary full" data-action="undo" data-id="'+t.id+'">'+(t.completed==='minimum'?'忙时已完成':'原目标已完成')+' · '+amount(completedAmount(t),t.unit)+' · 撤销打卡</button>':'<button class="primary" data-action="complete" data-id="'+t.id+'">'+(t.todayGoal?'今天打卡':'原目标打卡')+' · '+amount(normal(t),t.unit)+'</button>'+(t.minimum&&!t.todayGoal?'<button class="secondary" data-action="minimum" data-id="'+t.id+'">忙时打卡 · '+amount(t.minimum,t.unit)+'</button>':''))+'</div>'+(t.todayGoal&&!t.completed?'<p class="help">按今天缩减目标打卡，会记为忙时完成。</p>':''):'<p class="help">这个习惯今天没有安排。</p>')+'</section><section class="section"><div class="section-head"><h2>备注</h2><button class="text-btn" data-action="edit-note">'+(state.detailNoteOpen?'收起':'编辑')+'</button></div>'+(state.detailNoteOpen?'<form id="note-form"><label class="sr-only" for="detail-note">习惯备注</label><textarea id="detail-note" name="detailNote" maxlength="300">'+esc(t.note)+'</textarea><div class="note-actions"><button type="submit" class="secondary" data-action="save-note">保存备注</button></div><p class="help">备注只保存在当前窗口。</p></form>':'<p class="note-copy">'+esc(t.note||'还没有备注。')+'</p>')+'</section><section class="section"><div class="section-head"><h2>习惯计划</h2></div><div class="plan-list"><div class="plan-item"><span>重复</span><span>'+esc(frequency(t.days))+'</span></div><div class="plan-item"><span>开始日期</span><span class="tabular">'+esc(t.start.replaceAll('-','.'))+'</span></div><div class="plan-item"><span>计划时间</span><span class="tabular">'+esc(t.time||'未设置')+' · 仅排序</span></div></div><button class="secondary full" data-action="edit-plan" data-id="'+t.id+'">调整计划</button></section><section class="section"><div class="section-head"><h2>近28天安排历史</h2><span class="small muted">截至10月27日</span></div>'+renderHistory(t)+'</section><section class="more-operations"><button class="text-btn" data-action="more-operations" aria-expanded="'+state.operationsOpen+'">更多操作'+icon('down')+'</button>'+(state.operationsOpen?'<div class="operations-body"><button class="secondary full" data-action="pause">'+(t.pendingPause?'取消明天暂停':'从明天起暂停')+'</button><p>状态变化从明天生效。删除不在本次演示范围。</p></div>':'')+'</section></div>';
  }
  function menuRow(iconName,title,action,right='',subtitle=''){return '<button class="menu-row" data-action="'+action+'"><span class="menu-icon">'+icon(iconName)+'</span><span class="menu-text">'+title+(subtitle?'<small>'+subtitle+'</small>':'')+'</span><span class="menu-right">'+right+icon('chevron')+'</span></button>'}
  function renderMine(){
    const s=totals();let panel='';
    if(state.minePanel==='manage')panel='<div class="inline-panel"><h3>管理我的习惯</h3>'+tasks.map(t=>'<div class="manage-row"><span>'+esc(t.name)+'</span><button class="text-btn" data-action="open-detail" data-id="'+t.id+'">查看'+icon('chevron')+'</button></div>').join('')+'</div>';
    if(state.minePanel==='theme')panel='<div class="inline-panel"><h3>外观主题 · 入口预览</h3><p>本示例固定展示清爽日程融合版的浅色主题，未接入正式主题设置。</p></div>';
    if(state.minePanel==='reminder')panel='<div class="inline-panel"><h3>下一次提醒 · 入口预览</h3><p>这里只展示现有功能入口，没有创建提醒。习惯的计划时间仍只用于排序。</p></div>';
    if(state.minePanel==='social')panel='<div class="inline-panel"><h3>好友监督与分享</h3><p>此入口展示页面位置。本原型未接入好友或分享服务，不会发送邀请。</p></div>';
    if(state.minePanel==='feedback')panel='<div class="inline-panel"><h3>反馈</h3><p>这是界面方向演示。可以向设计评审者说明使用感受；这里不会提交反馈或读取账户信息。</p></div>';
    if(state.minePanel==='guide')panel='<div class="inline-panel"><h3>从一个小习惯开始</h3><p>选一个容易开始的平时目标，忙时目标可以再小一点。按自己的计划打卡，之后到进度页查看记录。</p><p style="margin-top:8px">计划时间只排序，不发提醒。忙时完成会单独标记，也计为一次打卡。</p></div>';
    return '<div class="page">'+top('我的')+'<div class="mine-intro"><h2>我的习惯空间</h2><p>按自己的节奏，把日常慢慢做好。</p><div class="mine-count"><span><strong>'+tasks.length+'</strong>个习惯</span><span><strong>'+s.done+'</strong>项今日完成</span></div></div><section class="section"><div class="section-head"><h2>习惯管理</h2></div><div class="menu-list">'+menuRow('list','管理我的习惯','mine-manage',tasks.length+'个')+'</div>'+(state.minePanel==='manage'?panel:'')+'</section><section class="section"><div class="section-head"><h2>偏好与提醒</h2></div><div class="menu-list"><div class="setting-row"><div><h3>显示首页短句</h3><p>在今日安排下方显示一句短句</p></div>'+switchControl('pref-phrase',state.showShortPhrase,'显示首页短句')+'</div>'+menuRow('sliders','外观主题','mine-theme','入口预览')+menuRow('clock','下一次提醒','mine-reminder','入口预览')+'</div>'+(['theme','reminder'].includes(state.minePanel)?panel:'')+'</section><section class="section"><div class="menu-list">'+menuRow('people','好友监督与分享','mine-social')+menuRow('message','反馈','mine-feedback')+menuRow('book','习惯入门','mine-guide')+'</div>'+(['social','feedback','guide'].includes(state.minePanel)?panel:'')+'</section><p class="demo-footer">当前为「清爽日程融合版」交互原型。<br>演示数据仅保留在当前窗口，不联网、不读取个人记录；刷新后恢复初始状态。</p></div>';
  }
  function render(focus=false){
    const oldTop=main.scrollTop;
    app.dataset.screen=state.screen;
    main.innerHTML=({today:renderToday,progress:renderProgress,edit:renderEdit,detail:renderDetail,mine:renderMine}[state.screen]||renderToday)();
    const active=['edit','detail'].includes(state.screen)?'today':state.screen;
    tabs.innerHTML=[['today','today','今日'],['progress','chart','进度'],['mine','person','我的']].map(([id,ic,label])=>'<button class="tab '+(id===active?'active':'')+'" data-action="screen" data-screen="'+id+'" '+(id===active?'aria-current="page"':'')+'><span class="tab-icon">'+icon(ic)+'</span><span>'+label+'</span></button>').join('');
    main.scrollTop=focus?0:oldTop;if(focus)main.focus({preventScroll:true});
    const details=main.querySelector('.more-settings');if(details)details.addEventListener('toggle',()=>{if(state.form)state.form.moreOpen=details.open});
  }
  function go(name){if(!['today','progress','edit','detail','mine'].includes(name))return;if(name==='edit'&&!state.form){state.editingId=null;state.form=newForm(null)}state.screen=name;render(true)}
  function updateForm(e){if(state.screen!=='edit'||!state.form||!e.target.name)return;const k=e.target.name;if(['name','normal','minimum','unit','start','time','note'].includes(k)){state.form[k]=e.target.value;if(k==='unit'){const oldTop=main.scrollTop;render();main.scrollTop=oldTop}}}
  app.addEventListener('input',updateForm);app.addEventListener('change',updateForm);
  app.addEventListener('click',e=>{
    const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,t=id?taskById(id):taskById(state.selected);
    if(['save','save-today','save-note'].includes(a))return;
    if(a==='screen'){go(b.dataset.screen);return}
    if(a==='new'){state.editingId=null;state.form=newForm(null);state.formError='';go('edit');return}
    if(a==='back'){go('today');return}
    if(a==='open-detail'){state.selected=id;state.detailNoteOpen=false;state.adjustOpen=false;state.operationsOpen=false;go('detail');return}
    if(a==='complete'||a==='minimum'){if(t.completed){notice('请先撤销已有打卡。');return}if(a==='minimum'&&t.todayGoal){notice('已设置今天的缩减目标，请直接打卡或先恢复原目标。');return}const adjusted=!!t.todayGoal;t.completed=(a==='minimum'||adjusted)?'minimum':'original';t.completedGoal=a==='minimum'?t.minimum:normal(t);state.adjustOpen=false;render();notice(t.name+'：'+(adjusted?'已按今天缩减目标打卡，记为忙时完成':a==='minimum'?'已按忙时目标打卡':'已按原目标打卡')+'。仅当前窗口演示。');return}
    if(a==='undo'){t.completed=null;delete t.completedGoal;render();notice('已撤销「'+t.name+'」的本次打卡。');return}
    if(a==='toggle-completed'){state.showCompleted=!state.showCompleted;render();return}
    if(a==='period'){state.period=b.dataset.period;render();return}
    if(a==='form-minimum'){state.form.minimumEnabled=!state.form.minimumEnabled;render();return}
    if(a==='weekday'){const d=Number(b.dataset.day),arr=state.form.days;state.form.days=arr.includes(d)?arr.filter(v=>v!==d):[...arr,d];render();return}
    if(a==='edit-plan'){state.editingId=id;state.form=newForm(t.pendingPlan||t);state.formError='';go('edit');return}
    if(a==='edit-note'){state.detailNoteOpen=!state.detailNoteOpen;render();return}
    if(a==='adjust-today'){if(t.completed){notice('请先撤销打卡，再调整今天目标。');return}state.adjustOpen=!state.adjustOpen;render();return}
    if(a==='restore-today'){if(t.completed){notice('请先撤销打卡，再恢复原目标。');return}delete t.todayGoal;state.adjustOpen=false;render();notice('已恢复今天的原目标，平时计划保持原值。');return}
    if(a==='more-operations'){state.operationsOpen=!state.operationsOpen;render();return}
    if(a==='pause'){t.pendingPause=!t.pendingPause;render();notice(t.pendingPause?'已设置明天暂停；今天仍可打卡。':'已取消明天暂停。');return}
    if(a==='pref-phrase'){state.showShortPhrase=!state.showShortPhrase;render();return}
    if(a.startsWith('mine-')){const panel=a.slice(5);state.minePanel=state.minePanel===panel?null:panel;render();return}
  });
  app.addEventListener('submit',e=>{
    e.preventDefault();
    if(e.target.id==='habit-form'){
      const f=state.form;let error='';
      if(!f.name.trim())error='请填写习惯名称。';else if(f.name.trim().length>20)error='习惯名称最多20个字符，请缩短后保存。';else if(!Number.isFinite(Number(f.normal))||Number(f.normal)<1||Number(f.normal)>9999)error='平时目标请填写 1—9999 之间的数字。';else if(f.minimumEnabled&&(!Number.isFinite(Number(f.minimum))||Number(f.minimum)<1||Number(f.minimum)>Number(f.normal)))error='忙时目标请填写大于0、且不超过平时目标的数字。';else if(!f.days.length)error='请选择至少一个重复星期。';else if(!state.editingId&&![TODAY,'2026-10-28'].includes(f.start))error='请选择今天或明天开始。';
      if(error){state.formError=error;render();const er=main.querySelector('.form-error');er.setAttribute('tabindex','-1');er.focus();return}
      const values={name:f.name.trim(),normal:Number(f.normal),minimum:f.minimumEnabled?Number(f.minimum):null,unit:f.unit,days:[...f.days],start:f.start,time:f.time,note:f.note};
      if(state.editingId){taskById(state.editingId).pendingPlan=values;notice('计划已保存在当前窗口，明天起生效。今天仍按原计划。')}else{tasks.push({id:'custom-'+(++state.counter),...values,completed:null,history:[]});notice('习惯已添加到当前窗口。未连接云端。')}
      state.form=null;state.editingId=null;state.formError='';go('today');
    }
    if(e.target.id==='today-form'){const t=taskById(state.selected),n=Number(e.target.elements.todayGoal.value);if(t.completed){notice('请先撤销打卡，再调整今天目标。');return}if(!Number.isInteger(n)||n<1||n>=t.normal){notice('今天的目标须为小于原目标 '+t.normal+' 的正整数。');return}t.todayGoal=n;state.adjustOpen=false;render();notice('仅今天的目标已调小，平时计划保持原值。')}
    if(e.target.id==='note-form'){taskById(state.selected).note=e.target.elements.detailNote.value;state.detailNoteOpen=false;render();notice('备注已保存在当前窗口。')}
  });
  window.setScreen=name=>go(name);
  window.addEventListener('message',event=>{const d=event.data;if(d&&d.type==='jiancheng-preview'&&typeof d.screen==='string')go(d.screen)});
  const initial=new URLSearchParams(location.search).get('screen');if(['today','progress','edit','detail','mine'].includes(initial))state.screen=initial;
  render();
})();
</script>
</body>
</html>
