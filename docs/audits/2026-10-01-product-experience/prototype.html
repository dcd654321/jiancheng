<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>渐成 · 体验设计原型</title><style>
:root{--bg:#F7F8F5;--surface:#fff;--ink:#303A34;--sub:#647067;--primary:#486557;--soft:#EDF1E2;--line:#E2E7DF;--border:#819086}*{box-sizing:border-box}body{margin:0;background:#ecefea;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}body.paper{--bg:#FAF8F3;--surface:#FFFEFA;--ink:#39352F;--sub:#70695F;--primary:#79604F;--soft:#F0F1E7;--line:#E6E0D6;--border:#998A7D}header{padding:20px;max-width:1000px;margin:auto}h1{font-size:22px;margin:0}header p{color:#526052;font-size:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;color:var(--ink);cursor:pointer;min-height:44px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 14px}button:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:3px}button:disabled{cursor:wait;color:var(--sub);background:var(--bg)}.toolbar button{font-size:14px}.toolbar button.selected{background:var(--primary);color:white}.phone{position:relative;width:min(390px,100%);min-height:760px;margin:16px auto 40px;background:var(--bg);border:1px solid var(--line);border-radius:20px;overflow:hidden}.native{height:52px;padding:12px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:14px}.native span{font-size:12px;color:var(--sub)}main{padding:20px 18px 150px}h2{font-size:26px;line-height:1.3;margin:0 0 12px;font-weight:600}h3{font-size:18px;line-height:1.4;margin:0 0 8px}.sub{color:var(--sub);font-size:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.template{text-align:left;width:100%;margin:0 0 12px;padding:16px}.template strong,.template span{display:block}.template span{font-size:14px;color:var(--sub);margin-top:4px}.primary{background:var(--primary);color:white;border-color:var(--primary)}.wide{width:100%;margin-top:12px;min-height:48px;font-weight:600}.busy{background:var(--soft)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.summary{margin:16px 0;color:var(--sub);font-size:14px}.chip{display:inline-block;background:var(--soft);border-radius:6px;font-size:14px;padding:2px 8px;margin-left:8px}.feedback{position:absolute;bottom:66px;left:16px;right:16px;border:1px solid var(--border);border-radius:16px;padding:12px;background:var(--surface)}.tabs{position:absolute;bottom:0;left:0;right:0;height:62px;display:flex;background:var(--surface);border-top:1px solid var(--line)}.tabs button{flex:1;border:0;border-radius:0;font-size:14px;color:var(--sub)}.tabs button.active{color:var(--primary);font-weight:600}.save{position:absolute;left:0;bottom:0;right:0;background:var(--surface);padding:16px 18px;border-top:1px solid var(--line)}label{display:block;margin:20px 0 8px;font-weight:600}input{width:100%;height:48px;border:1px solid var(--border);border-radius:12px;padding:12px;font:inherit;color:var(--ink);background:var(--surface)}.error{color:#A33D2A;font-size:14px;margin-top:12px}.invalid{outline:2px solid #A33D2A;outline-offset:-2px}.big{font-size:28px;font-weight:600}.note{max-width:760px;margin:0 auto 40px;padding:0 20px;font-size:14px;color:#526052}.done{color:var(--primary)}details{margin-top:16px}summary{cursor:pointer;min-height:44px;padding:10px 0}a{color:var(--primary)}@media(max-width:420px){.phone{border-radius:0;border-left:0;border-right:0;margin:0;min-height:760px}header{padding:16px}}
</style><header><h1>渐成 · 双档目标，做完再记下</h1><p>设计原型 · 虚构数据 · 不连接云端。顶部导航切换五个关键状态，或从首次进入走完整流程。</p><div class="toolbar" id="steps"></div><div class="toolbar" style="margin-top:12px"><button id="mist" onclick="theme('mist')">A 薄雾绿 · 行动清单</button><button id="paper" onclick="theme('paper')">B 暖纸白 · 记录簿配色</button></div></header><section class="phone"><div class="native"><button onclick="go('first')" style="border:0;padding:0;min-height:28px">渐成</button><span>微信导航与胶囊区域示意</span></div><main id="screen"></main><div id="bottom"></div></section><div class="note" id="note"></div><script>
const names={first:'1 首次进入',edit:'2 确认目标',today:'3 核心操作',done:'4 完成反馈',review:'5 回顾'};let page='first',habit={title:'读一会儿',target:30,minimum:10},record=null,records=[],busy=false,viewTheme='mist';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function theme(t){viewTheme=t;document.body.classList.toggle('paper',t==='paper');render()}
function go(p){if(busy)return;page=p;render()}
function template(t,n,m){habit={title:t,target:n,minimum:m};record=null;records=[];go('edit')}
function tabs(){return '<nav class="tabs" aria-label="主导航"><button class="'+(page==='today'||page==='done'?'active':'')+'" onclick="go(\'today\')">今日</button><button class="'+(page==='review'?'active':'')+'" onclick="go(\'review\')">进度</button><button onclick="document.getElementById(\'note\').textContent=\'我的管理页沿用现有小程序，本原型不扩展该页面。\'">我的</button></nav>'}
function card(title,target,min,second=false){return '<article class="card"><h3>'+esc(title)+'</h3><div class="sub">平时 '+target+' 分钟'+(min?'<span class="chip">忙时 '+min+' 分钟</span>':'')+'</div><button class="wide" '+(busy?'disabled':'')+' onclick="save('+target+','+second+')">'+(busy?'正在确认…':'按 '+target+' 分钟记下')+'</button>'+(min?'<button class="wide busy" '+(busy?'disabled':'')+' onclick="save('+min+','+second+')">按忙时 '+min+' 分钟记下</button>':'')+'</article>'}
function render(){document.getElementById('steps').innerHTML=Object.entries(names).map(([p,n])=>'<button class="'+(p===page?'selected':'')+'" onclick="go(\''+p+'\')">'+n+'</button>').join('');for(const t of ['mist','paper'])document.getElementById(t).classList.toggle('selected',t===viewTheme);let s='',b='',note='';
if(page==='first'){s='<h2>忙的时候，<br>也能做一点</h2><p class="sub">给习惯准备平时和忙时两个目标，<br>做完再记下。</p><h3 style="margin-top:24px">先选一件想做的事</h3>'+[['读一会儿',30,10],['锻炼一会儿',30,10],['复习一小段',30,10],['整理桌面',10,3]].map(([t,n,m])=>'<button class="template" onclick="template(\''+t+'\','+n+','+m+')"><strong>'+t+'</strong><span>示例：平时'+n+'分钟 · 忙时'+m+'分钟，可修改</span></button>').join('')+'<button class="wide" onclick="template(\'\',5,2)">自己设一个</button>';note='S1：选模板只进入确认，不创建；真实读取失败不能冒充首次空账户。';}
if(page==='edit'){s='<button onclick="go(\'first\')">返回</button><h2 style="margin-top:20px">准备两种安排</h2><p class="sub">示例目标，可以按你的时间修改。</p><form id="form" onsubmit="create(event)"><label for="title">习惯名称</label><input id="title" value="'+esc(habit.title)+'" placeholder="例如：下班读一会儿"><label for="target">平时做多少 · 分钟</label><input id="target" type="number" value="'+habit.target+'"><label for="minimum">忙时做多少 · 分钟（选填）</label><input id="minimum" type="number" value="'+habit.minimum+'"><p class="sub">忙时目标要小于平时目标；做完后再记录，不自动计时。</p><div class="summary">每天 · 今天开始</div><div role="alert" id="error" class="error"></div></form>';b='<div class="save"><button form="form" class="primary wide" type="submit">创建这个习惯</button></div>';note='S2：原型可编辑名称和两档数字；频率/开始日为默认摘要，完整调节沿用小程序现有表单。取消不创建。';}
if(page==='today'||page==='done'){let r=record;if(page==='done'&&!r)r={title:habit.title,amount:habit.minimum||habit.target,minimum:!!habit.minimum};s='<div class="row"><h2>今日</h2><button onclick="go(\'edit\')">添加习惯</button></div><div class="sub">10月1日 周四 · 示例日期</div><div class="summary">已记 '+(records.length|| (r?1:0))+' / 2 · 待做 '+(2-(records.length|| (r?1:0)))+'</div><div class="sub">先做，再记录；不会自动计时。</div>'+(!records.some(x=>!x.second)&&(!r||r.second)?card(habit.title,habit.target,habit.minimum):'')+(!records.some(x=>x.second)&&(!r||!r.second)?card('整理桌面',10,3,true):'')+(r?'<details><summary>今日已完成（'+(records.length||1)+'）</summary>'+records.filter(x=>x!==r).map(x=>'<article class="card"><h3>'+esc(x.title)+'</h3><div class="sub">'+x.amount+'分钟 · '+(x.minimum?'忙时':'平时')+'完成</div></article>').join('')+'<article class="card"><h3>'+esc(r.title)+'</h3><div class="done">'+(r.minimum?'忙时':'平时')+' '+r.amount+'分钟 · 已记下</div></article></details>':'');b=tabs()+(r?'<aside class="feedback"><div class="row"><div><strong>'+esc(r.title)+'</strong><div class="sub">已按'+(r.minimum?'忙时':'平时')+r.amount+'分钟记下</div></div><button onclick="undo()">撤销</button></div></aside>':'');note='S3/S4：记录以900毫秒模拟确认；等待时禁重复点击，成功后显示具体目标和撤销。原型没有云事务与网络恢复。';}
if(page==='review'){const r=record;s='<h2>回顾</h2><div class="sub">近7天 · 示例期间</div><article class="card"><div class="big">记下 '+records.length+' 次</div><p class="sub">平时 '+records.filter(x=>!x.minimum).length+' 次 · 忙时 '+records.filter(x=>x.minimum).length+' 次</p></article>'+(r?'<article class="card"><h3>'+esc(r.title)+'</h3><p>记下1次，其中'+(r.minimum?'忙时':'平时')+'1次。</p><div class="sub">回顾记录，再决定是否调整。忙时记录不等于完成原目标。</div></article><details><summary>查看逐日记录</summary><div class="card">10月1日 · '+esc(r.title)+'<div class="sub">'+r.amount+'分钟 · '+(r.minimum?'忙时':'平时')+'完成</div></div></details>':'<article class="card"><h3>还没有记录</h3><p class="sub">做完今天的一件事，再回来看看。</p><button class="wide primary" onclick="go(\'today\')">回今日看看</button></article>');b=tabs();note='S5：只汇总本次原型内实际记录，不生成额外完成事实；真实产品需保留完整日期与统计口径。';}
document.getElementById('screen').innerHTML=s;document.getElementById('bottom').innerHTML=b;document.getElementById('note').textContent=note;}
function create(e){e.preventDefault();const title=document.getElementById('title'),target=document.getElementById('target'),min=document.getElementById('minimum');for(const x of [title,target,min])x.classList.remove('invalid');let invalid=null,msg='';const n=Number(target.value),m=min.value===''?0:Number(min.value);if(!title.value.trim()||[...title.value.trim()].length>20){invalid=title;msg='名称请填写1–20个字。'}else if(!Number.isInteger(n)||n<1||n>9999){invalid=target;msg='平时目标请填写1–9999的整数。'}else if(min.value!==''&&(!Number.isInteger(m)||m<1||m>=n)){invalid=min;msg='忙时目标请填更小的正整数，或留空。'}if(invalid){invalid.classList.add('invalid');document.getElementById('error').textContent=msg;invalid.focus();return;}habit={title:title.value.trim(),target:n,minimum:m};record=null;records=[];go('today')}
function save(amount,second){if(busy)return;busy=true;render();setTimeout(()=>{record={second,title:second?'整理桌面':habit.title,amount,minimum:amount<(second?10:habit.target)};records=records.filter(x=>x.second!==second);records.push(record);busy=false;page='done';render()},900)}function undo(){if(busy)return;if(record)records=records.filter(x=>x.second!==record.second);record=records.length?records[records.length-1]:null;page='today';render()}render();
</script></html>
