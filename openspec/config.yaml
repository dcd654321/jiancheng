schema: spec-driven

context: |
  Language: zh-CN. 正文使用中文，保留 OpenSpec 结构标题及 SHALL/MUST。
  项目：渐成习惯打卡，原生微信小程序，JavaScript/WXML/WXSS，微信云开发。
  用户是业余时间开发的个人程序员，优先小范围、可验收、低维护成本的改动。
  仅 dev 开发，用户测试确认且明确要求后才能合并到 main。
  现状以代码和验证证据为准。云端是账户唯一持久来源，无本机持久快照或离线队列；直接进入今日，无打卡项时居中显示“添加习惯”，忙时目标选填且默认显示。模型集成及小目标助手已从本地源码移除，保留自定义、四模板与公开轻计划接续；旧 plan 接口固定返回 NOT_ENABLED，线上旧版本停用须另行核验。
  当前配置开发版/体验版使用共享测试环境，正式版使用共享正式环境；部署、真实云端、双账户与真机分别验收，不得把已部署描述为已验收。
  新资源前缀 jiancheng_daka_；不擅自改其他小程序或共用认证资源。
  server/ 和 miniprogram/core/ 的相关模块通过 scripts/build-cloud.cjs 生成云函数副本。
  常规验证 npm test / npm run check / npm run check:cloud；SDK 测试需要云函数依赖。
  不记录密钥、原始账户身份和生产用户数据。详细约定见根目录 AGENTS.md。

rules:
  proposal:
    - 简述目标、非目标、影响范围及可观察的验收结果，区分现状与拟新增行为。
  specs:
    - 每项需求配可执行场景，涉及数据和身份时覆盖隔离与恢复。
  design:
    - 涉及云端时说明资源范围、部署授权、回滚策略及不得自动迁移的数据。
  tasks:
    - 每项任务写验证方法，尽量可在一次工作时段内完成。
    - 实施、自动测试、云端验证和用户验收分别列项，未执行不得勾选。

operations:
  apply:
    guidance:
      - 用户授权实施后才开始，部署、删除和共用资源修改仍需独立核对授权。
  archive:
    guidance:
      - 用户验收前不归档为完成，归档不授予 main 合并或发布权限。

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
