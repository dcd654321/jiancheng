<!doctype html><html><head><meta charset="utf-8"><style>
body { font-family: sans-serif; background: #fff; margin: 24px; }
.chevron { width: 8px; height: 8px; border-right: 1.5px solid #486557; border-bottom: 1.5px solid #486557; transform: rotate(-45deg); margin: 0 4px; }
.chevron.down { transform: rotate(45deg); }
.chevron.up { transform: rotate(-135deg); }
.row { display: flex; align-items: center; gap: 40px; margin: 20px 0; font-size: 14px; }
.zoom { zoom: 6; }
</style></head><body>
<div class="row"><span>默认 &gt;</span><div class="chevron"></div><span>down &#8964;</span><div class="chevron down"></div><span>up &#8963;</span><div class="chevron up"></div></div>
<div class="row zoom"><div class="chevron"></div><div class="chevron down"></div><div class="chevron up"></div></div>
</body></html>
